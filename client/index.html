<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#12382c" />
    <title>ReportReady</title>
    <script>
      // Apply the saved theme (dark by default) before the page paints, so it never flashes white.
      try { document.documentElement.dataset.theme = localStorage.getItem('rca_theme') || 'dark'; }
      catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
